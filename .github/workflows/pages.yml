name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turn on Pages (build type: GitHub Actions) on first run so no
          # manual Settings → Pages change is needed.
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root. The World Cup draw app is served at
          # /world-cup-draw.html; the pension dashboard remains at /.
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# trigger deploy
